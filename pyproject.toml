[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "kai-code"
version = "0.1.0"
description = "DeepAgents-based Python coding agent (port-inspired by letta-code)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kai Code" }]

dependencies = [
  "deepagents>=0.2.8",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
google_genai = ["langchain-google-genai>=2.0.0"]
letta = ["letta-client>=1.0.0"]
tui = ["textual>=0.58.0"]

[project.urls]
Homepage = "https://github.com/fitrakacamarga/bmad-new"

[project.scripts]
kai = "kai_code.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kai_code"]
include = [
  "examples/**",
  "src/kai_code/_examples/**",
  "src/kai_code/models.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "examples/**",
  "src/kai_code/_examples/**",
  "src/kai_code/models.json",
]
