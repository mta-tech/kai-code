[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "kai-code"
version = "0.1.0"
description = "Local AI coding agent built on LangChain deepagents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kai Code" }]

dependencies = [
  "deepagents>=0.2.8",
  "langchain-google-genai>=4.1.2",
  "langchain-openai>=0.2.0",
  "prompt-toolkit>=3.0.52",
  "rich>=13.0.0",
  "requests",
  "tavily-python",
  "python-dotenv",
  "markdownify>=0.13.0",
  "langchain>=1.0.7",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
google-genai = ["langchain-google-genai>=2.0.0"]
openrouter = ["langchain-openai>=0.2.0"]
letta = ["letta-client>=1.0.0"]
dbt = ["duckdb>=1.0.0", "psycopg[binary]>=3.0.0"]
dbt-duckdb = ["duckdb>=1.0.0"]
dbt-postgres = ["psycopg[binary]>=3.0.0"]

[project.urls]
Homepage = "https://github.com/kai-code/kai-code"
Documentation = "https://github.com/kai-code/kai-code#readme"
Repository = "https://github.com/kai-code/kai-code"

[project.scripts]
kai = "kai_code.rich_main:cli_main"
kai-code = "kai_code.rich_main:cli_main"
kai-basic = "kai_code.cli:main"
kai-dbt = "kai_code.agents.dbt.cli:cli_main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kai_code"]
include = [
  "examples/**",
  "src/kai_code/_examples/**",
  "src/kai_code/models.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "examples/**",
  "src/kai_code/_examples/**",
  "src/kai_code/models.json",
]
